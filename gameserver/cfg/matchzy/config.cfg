// ─────────────────────────────────────────────────────────────
//  MatchZy core config
//  Положить в: C:\cs2server\game\csgo\cfg\MatchZy\config.cfg
//  (папка создастся автоматически при первом запуске MatchZy)
// ─────────────────────────────────────────────────────────────

// ── Webhooks → твой бэкенд на маке ───────────────────────────
// Замени IP на адрес мака в LAN (узнать: `ipconfig getifaddr en0` на маке)
matchzy_remote_log_url            "http://192.168.1.10:3001/webhooks/matchzy"
matchzy_remote_log_header_key     "X-Auth-Token"
matchzy_remote_log_header_value   "changeme-supersecret"

// ── Поведение матча ──────────────────────────────────────────
matchzy_minimum_ready_required    5           // сколько игроков в команде должны нажать !ready
matchzy_kick_when_no_match_loaded 0
matchzy_chat_prefix                "[{Green}MatchZy{Default}]"
matchzy_admin_chat_prefix          "{Red}[ADMIN]{Default}"

// Запись демок и стат
matchzy_demo_path                  "MatchZyDemos"
matchzy_demo_upload_url            ""        // (P4) сюда можно настроить аплоад
matchzy_save_stats                 1

// Knife round включается per-match через map_sides в match.json
matchzy_knife_enabled_default      1
matchzy_pause_after_restoring_round 1

echo "[MatchZy/config.cfg] loaded"
