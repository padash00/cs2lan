// ─────────────────────────────────────────────────────────────
//  CS2 Tournament Server — server.cfg
//  Положить в: C:\cs2server\game\csgo\cfg\server.cfg
// ─────────────────────────────────────────────────────────────

// ── Basic identification ─────────────────────────────────────
hostname                "My Tournament Server #1"
sv_tags                 "matchzy,tournament,lan"

// ── ВАЖНО: смени на свой длинный пароль ──────────────────────
rcon_password           "CHANGE_ME_LONG_RANDOM_STRING"

// Пароль на вход на сервер (пусто = открытый)
sv_password             ""

// ── LAN / Internet ───────────────────────────────────────────
// 1 = LAN only (без GSLT-токена). 0 = публичный (нужен GSLT).
sv_lan                  1

// ── Сеть / тикрейт ───────────────────────────────────────────
// CS2 в основном 64 tick; для матчей используй настройки клиентов 128.
sv_minrate              196608
sv_maxrate              0
sv_mincmdrate           64
sv_maxcmdrate           128
sv_minupdaterate        64
sv_maxupdaterate        128

// ── Качество жизни ───────────────────────────────────────────
sv_pure                 1
sv_pausable             1
mp_autoteambalance      0
mp_limitteams           0
mp_friendlyfire         1
mp_solid_teammates      1
mp_match_can_clinch     1

// ── Логи ─────────────────────────────────────────────────────
log                     on
sv_logbans              1
sv_logecho              1
sv_logfile              1

// ── Демки автозапись ─────────────────────────────────────────
tv_enable               1
tv_autorecord           1

// MatchZy сам управляет переключением warmup/live/knife/match,
// поэтому базовый game mode/type здесь не критичен — он перепишется
// при `matchzy_loadmatch`.
game_type               0
game_mode               1

echo "[server.cfg] loaded"
